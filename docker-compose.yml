services:
  db:
    image: postgres:16-alpine
    container_name: task_manager_db
    environment:
      POSTGRES_DB: task_manager_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
    container_name: task_manager_backend
    depends_on:
      - db
    env_file:
      - ./Backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/task_manager_db
      BACKEND_CORS_ORIGINS: '["http://127.0.0.1:5173","http://localhost:5173"]'
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    container_name: task_manager_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
